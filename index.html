<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Webrings</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 20px;
      box-shadow: 6px 6px 0px #111111;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .box {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
    }
    .box-header-accent {
      background: #F3EEDA;
      border-bottom: 2px solid #111111;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #111111;
    }
    .box-body { padding: 20px; font-size: 0.9rem; line-height: 1.6; }

    /* Griglia dei bottoni senza bordi */
    .buttons-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .buttons-grid a img {
      width: 88px;
      height: 31px;
      image-rendering: pixelated;
      border: none; /* Tolto il bordo */
      outline: none;
      transition: transform 0.1s ease;
      display: block;
    }

    .buttons-grid a img:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <header class="top-banner">
      <h1>WEBRINGS</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;">← HOME</a>
    </header>

    <div class="box">
      <div class="box-header-accent"><span>cool sites & links</span><span>♥</span></div>
      <div class="box-body">
        <p style="margin-bottom: 16px; text-align: center; font-size: 0.85rem;">Here are some awesome sites created by cool people. Click to visit them!</p>
        
        <!-- Griglia dei bottoni senza bordi -->
        <div class="buttons-grid">
          
          <a href="https://cloverstar.neocities.org/" target="_blank"><img src="https://cloverstar.neocities.org/images/button2.gif" alt="cloverstar"></a>
          
          <a target="_blank" href="https://fullsaphir.neocities.org"><img src="https://files.catbox.moe/d6leh6.gif" alt="Saphir's Dusk"></a>
          
          <a href="https://marketofstars.neocities.org/"><img src="https://marketofstars.neocities.org/button.png" alt="Market of Stars"/></a>
          
          <a href="https://bachira.neocities.org"><img src="https://files.catbox.moe/md67bd.png" alt="Bachira" height="31"></a>

        </div>

      </div>
    </div>

  </div>

</body>
</html>
