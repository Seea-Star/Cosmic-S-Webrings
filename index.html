  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 20px;
      box-shadow: 6px 6px 0px #111111;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .box {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
    }
    .box-header-accent {
      background: #F3EEDA;
      border-bottom: 2px solid #111111;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #111111;
    }
    .box-body { padding: 20px; font-size: 0.9rem; line-height: 1.6; }

    /* Griglia dei bottoni senza bordi */
    .buttons-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .buttons-grid a img {
      width: 88px;
      height: 31px;
      image-rendering: pixelated;
      border: none;
      outline: none;
      transition: transform 0.1s ease;
      display: block;
    }

    .buttons-grid a img:hover {
      transform: translateY(-2px);
    }

    /* Contenitore per affiancare i widget dei webring */
    .webrings-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }

    /* --- CODICE RESPONSIVE PER SMARTPHONE --- */
    @media screen and (max-width: 768px) {
      body {
        padding: 10px 5px;
      }
      .site-wrapper {
        padding: 14px;
        border-radius: 20px;
        box-shadow: 4px 4px 0px #111111;
        gap: 12px;
      }
      .top-banner {
        padding: 10px 15px;
        flex-direction: row;
        gap: 10px;
      }
      .top-banner h1 {
        font-size: 1.4rem;
        letter-spacing: 1px;
      }
      .box-body {
        padding: 14px;
      }
    }
  </style>
</head>
